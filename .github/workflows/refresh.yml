# Sharp Lines board refresh — GitHub Actions + GitHub Pages.
#
# Runs every 15 minutes (offset :07/:22/:37/:52) and rebuilds the
# public board from PropLine, then deploys it to GitHub Pages.
# The refresh itself is gated inside model/build_board.py to the
# 08:00-23:00 ET window and to the PropLine daily budget, so the
# cron below is deliberately wider than the window (UTC hours
# cover both EST and EDT); out-of-window runs exit quietly.
#
# The PropLine key comes ONLY from the PROPLINE_API_KEY repo
# secret (Settings -> Secrets and variables -> Actions). It is
# never written to a file or echoed to the log. If the secret
# is missing the run fails with a clear error.
#
# The workflow also commits the fresh board.json back to main
# (so the raw.githubusercontent.com URL keeps working) and
# persists the daily PropLine call counter in
# requests_log.jsonl. Pushes made with GITHUB_TOKEN do not
# re-trigger workflows, so this cannot loop.

name: Refresh Sharp Lines board

on:
  schedule:
    - cron: "7,22,37,52 12-23 * * *"
    - cron: "7,22,37,52 0-4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sharp-lines-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh board from PropLine
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: python3 model/build_board.py

      - name: Commit updated board and call log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add board.json requests_log.jsonl
          git diff --cached --quiet || git commit -m "Refresh board snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Stage site for Pages
        run: |
          mkdir -p _site
          cp index.html board.json _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
